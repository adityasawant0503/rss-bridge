[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Monte Carlo VaR, pairs trading and trend-following research on Indian (NSE) equities, with honest backtests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: PulsEdge site

on:
  push:
    branches:
      - master
    paths:
      - 'pulsedge/**'
      - '.github/workflows/pulsedge-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pulsedge-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: pulsedge
    - id: deployment
      uses: actions/deploy-pages@v4

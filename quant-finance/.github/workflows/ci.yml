name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Smoke-test every script on synthetic data
        run: |
          python scripts/monte_carlo_var.py --synthetic
          python scripts/pairs_trading.py --synthetic
          python scripts/ma_crossover.py --synthetic

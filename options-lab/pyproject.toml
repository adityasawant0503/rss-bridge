[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optlab"
version = "0.1.0"
description = "Option pricing (Black-Scholes, binomial, Monte Carlo), Greeks, implied volatility and a delta-hedging study on Nifty 50"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["optlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
